[project]
name = "signal-gate"
version = "0.1.0"
description = "Evidence-first response safety gate using Strands Decider 2B and Amazon Bedrock."
requires-python = ">=3.10"
dependencies = ["strands-agents>=1.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

